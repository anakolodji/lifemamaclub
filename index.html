  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function enhancePage(text, route) {
      if (!route) return text;

      function pageBootstrap(currentRoute) {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        function notify(type, detail) {
          window.parent.postMessage(Object.assign({ __lmc: type, route: currentRoute }, detail || {}), '*');
        }

        function siteAssetUrl(name) {
          try {
            const base = new URL('.', window.parent.location.href.split('#')[0]).href;
            return new URL('assets/' + name, base).href;
          } catch (error) {
            return 'assets/' + name;
          }
        }

        function sectionForLink(link) {
          const label = (link.textContent || '').toLocaleLowerCase('pt-BR');
          if (label.includes('experiência')) return 'experiencia';
          if (label.includes('incluído') || label.includes('benefícios')) return 'incluido';
          if (label.includes('club')) return 'club';
          return '';
        }

        window.addEventListener('click', function(event) {
          const link = event.target.closest && event.target.closest('a[href]');
          if (!link) return;
          const href = link.getAttribute('href') || '';

          if (currentRoute === 'home' && href === '#candidatura') {
            event.preventDefault();
            notify('navigate', { target: 'candidatura' });
            return;
          }

          if (/Candidatura[.]dc[.]html/i.test(href)) {
            event.preventDefault();
            notify('navigate', { target: 'candidatura' });
            return;
          }

          if (/Main[.]dc[.]html/i.test(href)) {
            event.preventDefault();
            notify('navigate', { target: 'home', section: sectionForLink(link) });
            return;
          }

          if (href === '#') event.preventDefault();
        }, true);

        window.addEventListener('submit', function(event) {
          if (currentRoute !== 'candidatura' || !(event.target instanceof HTMLFormElement)) return;
          const form = event.target;
          const dimensionButtons = Array.from(form.querySelectorAll('[role="group"][aria-label="Dimensões da vida"] button'));
          const hasDimension = dimensionButtons.some(function(button) {
            return button.getAttribute('aria-pressed') === 'true' || button.classList.contains('is-selected');
          });

          let error = form.querySelector('#dimension-error');
          if (!hasDimension) {
            event.preventDefault();
            if (!error) {
              error = document.createElement('p');
              error.id = 'dimension-error';
              error.className = 'lmc-field-error';
              error.setAttribute('role', 'alert');
              error.textContent = 'Selecione pelo menos uma dimensão para continuar.';
              const group = form.querySelector('[role="group"][aria-label="Dimensões da vida"]');
              if (group) {
                group.setAttribute('aria-describedby', error.id);
                group.insertAdjacentElement('afterend', error);
              }
            }
            if (dimensionButtons[0]) dimensionButtons[0].focus();
          } else if (error) {
            error.remove();
          }

          if (!form.checkValidity()) {
            event.preventDefault();
            form.reportValidity();
            return;
          }

          if (!hasDimension) return;
          event.preventDefault();
          notify('navigate', { target: 'confirmacao' });
        }, true);

        window.addEventListener('message', function(event) {
          const data = event.data;
          if (!data || data.__lmc !== 'activate') return;

          if (data.section) {
            const section = document.getElementById(data.section);
            if (section) section.scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
            return;
          }

          window.scrollTo({ top: 0, behavior: 'auto' });
          const heading = document.querySelector('h1');
          if (heading) {
            heading.setAttribute('tabindex', '-1');
            heading.focus({ preventScroll: true });
          }
          window.setTimeout(function() { window.scrollTo({ top: 0, behavior: 'auto' }); }, 80);
        });

        function reorderHomeFlow() {
          if (currentRoute !== 'home') return true;
          const included = document.getElementById('incluido');
          const experience = document.getElementById('experiencia');
          if (!included || !experience) return false;

          if (included.parentElement === experience.parentElement && included.nextElementSibling !== experience) {
            experience.before(included);
          }

          const primaryNav = document.querySelector('nav.nav');
          if (primaryNav) {
            const includedLink = primaryNav.querySelector('a[href="#incluido"]');
            const experienceLink = primaryNav.querySelector('a[href="#experiencia"]');
            if (includedLink && experienceLink && includedLink.nextElementSibling !== experienceLink) {
              experienceLink.before(includedLink);
            }
          }
          return true;
        }

        function installHomePhotography() {
          if (currentRoute !== 'home') return true;
          const photoRules = [
            { match: 'mesa elegante', file: 'community-roundtable.jpg', position: 'center center' },
            { match: 'praticando yoga', file: 'wellness-movement.jpg', position: 'center center' },
            { match: 'atividade esportiva', file: 'sport-tennis.jpg', position: '52% center' },
            { match: 'oficina de cerâmica', file: 'creative-ceramics.jpg', position: 'center center' },
            { match: 'carreira e projetos', file: 'career-creative-projects.jpg', position: 'center center' },
            { match: 'leitura e contemplação', file: 'culture-contemplation.jpg', position: '70% center' },
            { match: 'ambiente cultural', file: 'culture-museum.jpg', position: 'center center' },
            { match: 'ambiente acolhedor', file: 'creative-floral-workshop.jpg', position: 'center center' },
            { match: 'pequeno grupo', file: 'community-hands.jpg', position: 'center center' }
          ];

          document.querySelectorAll('figure.ph[aria-label]').forEach(function(figure) {
            const label = (figure.getAttribute('aria-label') || '').toLocaleLowerCase('pt-BR');
            const rule = photoRules.find(function(item) { return label.includes(item.match); });
            if (!rule) return;

            let image = figure.querySelector(':scope > img.lmc-editorial-photo');
            if (!image) {
              image = document.createElement('img');
              image.className = 'lmc-editorial-photo';
              image.decoding = 'async';
              figure.prepend(image);
            }
            if (figure.dataset.lmcPhoto !== rule.file) {
              image.src = siteAssetUrl(rule.file);
              image.alt = figure.getAttribute('aria-label') || '';
              image.loading = rule.file === 'community-roundtable.jpg' ? 'eager' : 'lazy';
              image.style.objectPosition = rule.position;
              figure.dataset.lmcPhoto = rule.file;
            }
            figure.classList.add('lmc-photo-loaded');
            figure.removeAttribute('role');
          });
          return true;
        }

        function installHomeShowcase() {
          if (currentRoute !== 'home') return true;
          reorderHomeFlow();
          if (document.getElementById('experiencias-passadas')) return true;
          const included = document.getElementById('incluido');
          if (!included) return false;

          let baseUrl = '';
          try {
            baseUrl = new URL('.', window.parent.location.href.split('#')[0]).href;
          } catch (error) {
            baseUrl = './';
          }
          const imageUrl = function(name) { return new URL('assets/' + name, baseUrl).href; };
          const shell = document.createElement('div');
          shell.innerHTML = `
            <section id="experiencias-passadas" class="lmc-past lmc-reveal is-visible" aria-labelledby="past-title">
              <div class="lmc-container">
                <div class="lmc-section-head">
                  <div>
                    <p class="lmc-eyebrow">Experiências em destaque</p>
                    <h2 id="past-title" class="serif">Encontros que deixam histórias para contar.</h2>
                  </div>
                  <div class="lmc-section-intro">
                    <p>Uma seleção de propostas que traduzem o espírito do Club: presença, descoberta e conversas que continuam depois do encontro.</p>
                    <p class="lmc-content-note">Galeria conceitual · imagens ilustrativas até a inclusão dos registros oficiais.</p>
                  </div>
                </div>
                <div class="lmc-gallery">
                  <article class="lmc-experience-card">
                    <figure>
                      <img src="${imageUrl('wellness-movement.jpg')}" loading="lazy" decoding="async" alt="Mulheres praticando movimento e bem-estar em grupo">
                      <figcaption>Imagem ilustrativa</figcaption>
                    </figure>
                    <div class="lmc-card-copy">
                      <p class="lmc-card-number">Proposta 01 · Wellness</p>
                      <h3 class="serif">Manhã de presença</h3>
                      <p>Movimento gentil, pausas conscientes e uma conversa acolhedora para começar o dia com mais espaço e conexão.</p>
                      <ul aria-label="Destaques da proposta"><li>Movimento</li><li>Autocuidado</li><li>Conexão</li></ul>
                    </div>
                  </article>
                  <article class="lmc-experience-card">
                    <figure>
                      <img src="${imageUrl('creative-clay.jpg')}" loading="lazy" decoding="async" alt="Mãos modelando argila durante uma oficina criativa">
                      <figcaption>Imagem ilustrativa</figcaption>
                    </figure>
                    <div class="lmc-card-copy">
                      <p class="lmc-card-number">Proposta 02 · Criatividade</p>
                      <h3 class="serif">Criar com as mãos</h3>
                      <p>Uma oficina tátil para experimentar a cerâmica, desacelerar e descobrir novas formas de expressão em boa companhia.</p>
                      <ul aria-label="Destaques da proposta"><li>Cerâmica</li><li>Descoberta</li><li>Trocas</li></ul>
                    </div>
                  </article>
                  <article class="lmc-experience-card">
                    <figure>
                      <img src="${imageUrl('community-roundtable.jpg')}" loading="lazy" decoding="async" alt="Mulheres reunidas ao redor de uma mesa para conversar">
                      <figcaption>Imagem ilustrativa</figcaption>
                    </figure>
                    <div class="lmc-card-copy">
                      <p class="lmc-card-number">Proposta 03 · Conexões</p>
                      <h3 class="serif">Mesa de trocas</h3>
                      <p>Uma conversa mediada sobre escolhas, projetos e caminhos possíveis, com escuta atenta e perspectivas diversas.</p>
                      <ul aria-label="Destaques da proposta"><li>Carreira</li><li>Repertório</li><li>Comunidade</li></ul>
                    </div>
                  </article>
                  <article class="lmc-experience-card">
                    <figure>
                      <img src="${imageUrl('creative-florist.jpg')}" loading="lazy" decoding="async" alt="Mulher preparando flores em uma oficina criativa">
                      <figcaption>Imagem ilustrativa</figcaption>
                    </figure>
                    <div class="lmc-card-copy">
                      <p class="lmc-card-number">Proposta 04 · Hobbies</p>

"<!DOCTYPE html>\n<html lang=\"pt-BR\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#76412F\">\n<title>Life Mama Club — Conexões, Desenvolvimento e Experiências<\u002Ftitle>\n<style>\n*{box-sizing:border-box}\nhtml,body{width:100%;height:100%;margin:0;overflow:hidden;background:#76412F}\nbody{font-family:Manrope,system-ui,-apple-system,\"Segoe UI\",sans-serif}\n.site-shell,.route-stack{position:relative;width:100%;height:100%}\n.route-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#F4EFE8;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(10px) scale(.997);transition:opacity .42s cubic-bezier(.22,1,.36,1),transform .42s cubic-bezier(.22,1,.36,1),visibility 0s linear .42s}\n.route-frame.is-active{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}\n.route-progress{position:fixed;z-index:20;top:0;left:0;width:100%;height:3px;pointer-events:none;transform:scaleX(0);transform-origin:left;background:#F0B58F;opacity:0;transition:transform .38s cubic-bezier(.22,1,.36,1),opacity .2s ease}\n.route-progress.is-moving{transform:scaleX(1);opacity:1}\n.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}\n@media(prefers-reduced-motion:reduce){.route-frame{transition:none;transform:none}.route-progress{display:none}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<main class=\"site-shell\" aria-label=\"Life Mama Club\">\n<h1 class=\"sr-only\">Life Mama Club<\u002Fh1>\n<div class=\"route-stack\">\n<iframe class=\"route-frame\" data-route=\"home\" src=\"about:blank#58cae41f-0f8d-4780-9613-4bd6d2f92f2a\" title=\"Life Mama Club\" loading=\"eager\"><\u002Fiframe>\n<iframe class=\"route-frame\" data-route=\"candidatura\" src=\"about:blank#2610e130-17d9-438a-acbd-d00fd3fd2ed1\" title=\"Candidatura — Life Mama Club\" loading=\"eager\"><\u002Fiframe>\n<iframe class=\"route-frame\" data-route=\"confirmacao\" src=\"about:blank#b8c18fbc-0dfd-41ae-9fcf-145dac1e762b\" title=\"Candidatura recebida — Life Mama Club\" loading=\"eager\"><\u002Fiframe>\n<\u002Fdiv>\n<div class=\"route-progress\" aria-hidden=\"true\"><\u002Fdiv>\n<p id=\"route-status\" class=\"sr-only\" role=\"status\" aria-live=\"polite\"><\u002Fp>\n<\u002Fmain>\n<script>\n(function(){\n  const frames=Array.from(document.querySelectorAll('.route-frame'));\n  const progress=document.querySelector('.route-progress');\n  const status=document.getElementById('route-status');\n  const labels={home:'Life Mama Club',candidatura:'Candidatura',confirmacao:'Candidatura recebida'};\n  let activeRoute='';\n  let transitionTimer=0;\n  function routeFromLocation(){\n    const value=location.hash.replace(/^#\\/?/,'').split('/')[0];\n    return labels[value]?value:'home';\n  }\n  function activate(route,options){\n    const next=labels[route]?route:'home';\n    const opts=options||{};\n    const changed=activeRoute!==next;\n    activeRoute=next;\n    frames.forEach(function(frame){\n      const active=frame.dataset.route===next;\n      frame.classList.toggle('is-active',active);\n      frame.setAttribute('aria-hidden',String(!active));\n      frame.tabIndex=active?0:-1;\n    });\n    if(opts.history!==false){\n      const hash=next==='home'?'#/':'#/'+next;\n      if(location.hash!==hash) history.pushState({route:next},'',hash);\n    }\n    document.title=next==='home'?'Life Mama Club — Conexões, Desenvolvimento e Experiências':labels[next]+' — Life Mama Club';\n    status.textContent=labels[next]+' carregada';\n    if(changed){\n      progress.classList.add('is-moving');\n      clearTimeout(transitionTimer);\n      transitionTimer=setTimeout(function(){progress.classList.remove('is-moving')},430);\n    }\n    const activeFrame=frames.find(function(frame){return frame.dataset.route===next});\n    setTimeout(function(){\n      if(activeFrame&&activeFrame.contentWindow){\n        activeFrame.contentWindow.postMessage({__lmc:'activate',section:opts.section||''},'*');\n      }\n    },changed?440:40);\n  }\n  window.addEventListener('message',function(event){\n    const frame=frames.find(function(item){return item.contentWindow===event.source});\n    if(!frame||!event.data||!event.data.__lmc)return;\n    if(event.data.__lmc==='navigate')activate(event.data.target,{section:event.data.section||''});\n    if(event.data.__lmc==='ready'&&frame.dataset.route===activeRoute){\n      frame.contentWindow.postMessage({__lmc:'activate'},'*');\n    }\n  });\n  window.addEventListener('popstate',function(){activate(routeFromLocation(),{history:false})});\n  activate(routeFromLocation(),{history:false});\n})();\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"
